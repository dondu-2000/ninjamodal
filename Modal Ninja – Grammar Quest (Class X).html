<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modal Ninja – Grammar Quest for Class X</title>
<style>
:root{--bg:#f4efe6;--card:#fff;--ink:#1d1b2e;--mut:#6b6880;--acc:#d6322f;--ok:#1f9d55;--bad:#d6322f;--line:#ddd5c5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14122a;--card:#201d3d;--ink:#f1eefc;--mut:#a8a3c4;--line:#3a3667;color-scheme:dark}}
:root[data-theme=dark]{--bg:#14122a;--card:#201d3d;--ink:#f1eefc;--mut:#a8a3c4;--line:#3a3667;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px}
h1{margin:6px 0;font-size:28px}h2{font-size:20px;margin:8px 0 12px}.mut{color:var(--mut);margin:0 0 10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
button{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.lv{display:flex;justify-content:space-between;gap:8px;width:100%;margin:8px 0;padding:14px;font-weight:700;text-align:left}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
.scene{container-type:inline-size;position:relative;height:150px;border-radius:16px;overflow:hidden;background:linear-gradient(#ffe8c2,#ffb766);border:2px solid var(--line)}
.scene:after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;background:#6b4a2f}
.ninja,.foe{position:absolute;bottom:24px;z-index:2;transition:transform .35s ease}
.ninja{left:8%;width:62px}.foe{right:8%;font-size:62px;line-height:1}
.ninja.dash{transform:translateX(58cqw)}.ninja.hurt{animation:shake .5s;filter:drop-shadow(0 0 8px red)}
.foe.die{animation:die .6s forwards}.foe.strike{transform:translateX(-58cqw)}.foe.in{animation:fin .4s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
@keyframes die{to{transform:translateY(-50px) rotate(540deg) scale(.2);opacity:0}}
@keyframes fin{from{transform:translateX(90px);opacity:0}}
.slash{position:absolute;right:12%;bottom:62px;width:100px;height:6px;border-radius:4px;background:#fff;box-shadow:0 0 16px #fff;transform:rotate(-35deg) scaleX(0);opacity:0;z-index:3}
.slash.go{animation:sl .4s}@keyframes sl{30%{opacity:1;transform:rotate(-35deg) scaleX(1)}100%{opacity:0;transform:rotate(-35deg) scaleX(1)}}
.flash{position:absolute;inset:0;background:red;opacity:0;pointer-events:none;z-index:4}.flash.go{animation:fl .5s}@keyframes fl{30%{opacity:.45}}
.opt{display:block;width:100%;text-align:left;margin:8px 0;font-weight:600}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no{background:var(--bad);border-color:var(--bad);color:#fff}.opt.off{opacity:.25}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--acc)}
.ans{display:flex;flex-wrap:wrap;gap:8px;border:2px dashed var(--line);border-radius:12px;padding:8px;min-height:56px;margin:8px 0}
.tiles{display:flex;flex-wrap:wrap;gap:8px}.tile{padding:8px 12px;font-weight:600}
.fb{margin-top:10px;padding:10px;border-radius:12px;font-weight:600}
small{color:var(--mut)}
</style></head><body><main></main>
<script>
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const bp=(f,d)=>{try{const c=bp.c||(bp.c=new AudioContext),o=c.createOscillator(),v=c.createGain();o.frequency.value=f;o.connect(v);v.connect(c.destination);v.gain.value=.08;o.start();o.stop(c.currentTime+d)}catch{}};
let st;try{st=JSON.parse(localStorage.mn)}catch{}if(!Array.isArray(st))st=[0,0,0,0,0];
const sv=()=>{try{localStorage.mn=JSON.stringify(st)}catch{}};
const NJ='<svg class="ninja" id="nj" viewBox="0 0 70 90"><circle cx="35" cy="22" r="16" fill="#111"/><rect x="20" y="17" width="30" height="9" rx="4" fill="#f3d9b1"/><circle cx="29" cy="21.5" r="2" fill="#111"/><circle cx="41" cy="21.5" r="2" fill="#111"/><path d="M19 11h32v5H19z" fill="#d6322f"/><path d="M51 13l14 7-12 3z" fill="#d6322f"/><rect x="22" y="38" width="26" height="30" rx="8" fill="#111"/><rect x="22" y="52" width="26" height="5" fill="#d6322f"/><rect x="24" y="66" width="9" height="20" rx="4" fill="#111"/><rect x="37" y="66" width="9" height="20" rx="4" fill="#111"/><path d="M48 44l18-14" stroke="#cfd8e3" stroke-width="4" stroke-linecap="round"/></svg>';
const F=['👹','👺','🧟','👾','🦹'];
// question: [text, options, correctIndex, hint, explanation]
const L=[
{t:'Dojo of Ability & Permission',q:[
['Tashi ___ speak four languages when he was only ten.',['could','can','may','shall'],0,'It happened in the past.','“Could” expresses general ability in the past.'],
['___ I borrow your Dzongkha dictionary, please?',['Must','May','Ought','Will'],1,'A polite permission question.','“May I…?” politely asks for permission.'],
['Pema is a strong swimmer; she ___ swim across the river easily.',['must','should','can','would'],2,'Present ability.','“Can” shows present ability.'],
['I ___ not find my keys anywhere yesterday.',['could','can','may','shall'],0,'Yesterday = past.','“Could not” = past inability.'],
['Which sentence shows PERMISSION?',['You may enter the lhakhang now.','She can juggle three balls.','He could run fast as a boy.','It may rain tonight.'],0,'Someone is allowed to do something.','“You may enter” gives permission.'],
['Which sentence shows POSSIBILITY?',['May I sit here?','It may snow in Thimphu tonight.','He can ride a horse.','You may leave now.'],1,'Something could happen.','“It may snow” = it is possible.'],
['___ you pass the ema datshi, please?',['Could','Must','Should','Need'],0,'A polite request.','“Could you…?” is a polite request.'],
['Which is the most formal way to ask permission?',['Can I leave?','Let me leave.','May I leave, please?','I leave now.'],2,'Imagine speaking to the Principal.','“May I…, please?” is the most formal.']]},
{t:'Bridge of Duty & Advice',q:[
['You ___ wear a helmet when riding a motorbike; it is the law.',['might','must','could','may'],1,'Strong obligation.','“Must” = strong obligation (rule or law).'],
['You look tired. You ___ rest for a while.',['should','would','mustn’t','can’t'],0,'Friendly advice.','“Should” gives advice.'],
['You ___ be honest in your exams.',['ought','ought to','should to','must to'],1,'This modal needs “to”.','“Ought to” always includes “to”.'],
['Doctors ___ wear masks in the operation theatre; it is the hospital rule.',['has to','have to','having to','had to'],1,'Plural subject, present time.','“Have to” = external rule; plural subject.'],
['He ___ study harder if he wants to pass; otherwise he may fail.',['had better','has better','would better','did better'],0,'Advice with a warning.','“Had better” = strong advice with a warning.'],
['Drivers ___ stop at a red light.',['might','may','must','could'],2,'It is the law.','“Must” is used for rules and laws.'],
['Which sentence gives ADVICE?',['You should drink more water.','You may drink water.','You can drink water.','You drank water.'],0,'Think “a good idea”.','“Should” = advice.'],
['Which sentence shows the STRONGEST obligation?',['You could go.','You should go.','You ought to go.','You must go.'],3,'No choice at all.','“Must” is the strongest.']]},
{t:'Temple of Puzzles',q:[
['You ___ shout inside the lhakhang; it is disrespectful.',['mustn’t','don’t have to','needn’t','might not'],0,'It is forbidden.','“Mustn’t” = prohibition.'],
['It is a holiday, so students ___ wear uniform. It isn’t necessary.',['mustn’t','don’t have to','can’t','ought not'],1,'No obligation – not a ban.','“Don’t have to” = not necessary (different from mustn’t!).'],
['Karma is in Paro today, so she ___ be in Thimphu.',['can’t','must','may','need'],0,'You are sure it is impossible.','“Can’t” = logical impossibility.'],
['Dorji’s bag is here and his shoes are by the door, so he ___ be inside.',['can’t','must','needn’t','mustn’t'],1,'You are almost sure it is true.','“Must” can show logical certainty.'],
['I’m not sure, but the match ___ start at 2 p.m.',['might','must','ought','has to'],0,'You are not certain.','“Might” = weak possibility.'],
['You ___ bring a pen; the school will provide one.',['mustn’t','needn’t','can’t','oughtn’t'],1,'It isn’t necessary.','“Needn’t” = it isn’t necessary.'],
['Which sentence is correct?',['He cans swim.','He can swims.','He can swim.','He can to swim.'],2,'Modals take no -s and no “to”.','After a modal, use the base verb.'],
['“You needn’t pay” means…',['Payment is not necessary.','Payment is forbidden.','Payment is advised.','Payment is possible.'],0,'Need not = no need.','“Needn’t” = no need.'],
['Which of these is NOT a modal verb?',['might','shall','do','would'],2,'It is an ordinary auxiliary.','“Do” is an auxiliary verb, not a modal.']]},
{t:'Shadow Castle: Past Modals',q:[
['The window is broken and a ball is inside. Someone ___ broken it with the ball.',['must have','must has','should had','can have'],0,'You are sure, from the evidence.','“Must have + V3” = past deduction.'],
['You failed the test. You ___ studied harder.',['should have','should has','must have','can have'],0,'Looking back with regret.','“Should have + V3” = regret or criticism.'],
['I’m not sure why Dawa is late. He ___ missed the bus.',['might have','may has','can have','would to have'],0,'You are not sure.','“Might have + V3” = past possibility.'],
['She ___ have passed the exam; she didn’t even study!',['can’t','mustn’t','shouldn’t','needn’t'],0,'You are sure it didn’t happen.','“Can’t have + V3” = sure it did not happen.'],
['We walked in the rain all the way. We ___ taken a taxi!',['could have','could has','can have','must had'],0,'It was possible, but we didn’t.','“Could have + V3” = an unused chance.'],
['Which sentence CRITICISES a past action?',['You should have called me.','You must call me.','You may call me.','You can call me.'],0,'Look for the past form.','“Should have called” = criticism.'],
['Which is correct?',['He should of come.','He should have came.','He should have come.','He should has come.'],2,'Modal + have + past participle.','Use “have” + V3 (come), never “of”.']]},
{t:'Sensei’s Sentence Forge',s:[
'You must wear a gho or kira to school.|You must wear a kira or gho to school.',
'May I come in, please?',
'You mustn’t shout inside the lhakhang.',
'She can’t be at home because the lights are off.|Because the lights are off, she can’t be at home.',
'We should have started earlier.',
'He might have missed the bus.',
'They don’t have to pay for the tickets.',
'Could you open the window, please?']}];
let g={};const main=$('main');
function home(){main.innerHTML='<h1>⚔️ Modal Ninja</h1><p class=mut>Grammar Quest · Class X · Modal Verbs</p><div class=card>Answer correctly and your ninja <b>slices</b> the enemy. Answer wrongly and you get <b>hit</b>! You have <b>3 ❤️ lives</b> and <b>2 💡 hints</b> per level. Finish a level to unlock the next one.</div>'+
L.map((l,k)=>`<button class=lv data-a=go data-k=${k} ${k&&!st[k-1]?'disabled':''}><span>${k&&!st[k-1]?'🔒 ':''}Level ${k+1}: ${l.t}</span><span>${'★'.repeat(st[k])+'☆'.repeat(3-st[k])}</span></button>`).join('')+
'<details class=card><summary><b>Modal cheat-sheet</b></summary><p>can / could – ability · may / might – possibility · may / could – permission &amp; requests · must / have to – obligation · should / ought to – advice · mustn’t – forbidden · needn’t / don’t have to – not necessary · must / can’t – deduction · should have / could have + V3 – past regret &amp; chances</p></details>'}
function go(k){g={k,i:0,lives:3,hints:2,score:0,streak:0,lock:0,qs:sh(L[k].q||L[k].s)};
main.innerHTML=`<div class=top><span>Lv ${k+1}</span><span id=hud></span><button id=hb data-a=hint></button></div><div class=scene>${NJ}<span class=foe id=foe></span><div class=slash id=sl></div><div class=flash id=fl></div></div><div id=box></div>`;hud();nx()}
function hud(){$('#hud').textContent='❤️'.repeat(g.lives)+'🖤'.repeat(3-g.lives)+'  ⭐ '+g.score+(g.streak>1?' 🔥'+g.streak:'');$('#hb').textContent='💡 '+g.hints}
function nx(){g.lock=0;g.tr=0;const n=g.qs.length;if(g.i>=n)return win();
const f=$('#foe');f.textContent=g.i==n-1?'🐲':F[(g.i+g.k)%5];f.className='foe in';$('#sl').className='slash';
const q=g.qs[g.i],h=`<div class=card><small>Question ${g.i+1} of ${n}</small>`;
if(g.k<4){g.o=sh(q[1].map((t,j)=>[t,j==q[2]]));$('#box').innerHTML=h+`<h2>${q[0].replace('___','<span class=blank></span>')}</h2>`+g.o.map((o,j)=>`<button class=opt data-a=pick data-k=${j}>${o[0]}</button>`).join('')+'<div id=fb></div></div>'}
else{g.ans=q.split('|');g.tl=sh(g.ans[0].split(' '));g.b=[];$('#box').innerHTML=h+'<h2>Build the sentence</h2><div class=ans id=ans></div><div class=tiles id=pool></div><p><button class=btn data-a=chk>⚔️ Strike!</button> <button data-a=clr>Clear</button></p><div id=fb></div></div>';sU()}}
function sU(){$('#ans').innerHTML=g.b.map(k=>`<button class=tile data-a=un data-k=${k}>${g.tl[k]}</button>`).join('');$('#pool').innerHTML=g.tl.map((w,k)=>g.b.includes(k)?'':`<button class=tile data-a=add data-k=${k}>${w}</button>`).join('')}
async function fx(ok){const n=$('#nj'),f=$('#foe');
if(ok){n.classList.add('dash');await sleep(340);$('#sl').classList.add('go');f.classList.add('die');await sleep(350);n.classList.remove('dash');await sleep(300)}
else{f.classList.add('strike');await sleep(340);n.classList.add('hurt');$('#fl').classList.add('go');await sleep(550);f.classList.remove('strike');n.classList.remove('hurt');$('#fl').classList.remove('go')}}
async function res(ok,msg){g.lock=1;ok?bp(660,.15):bp(140,.3);await fx(ok);
if(ok){g.streak++;g.score+=100+g.streak*10}else{g.streak=0;g.lives--}hud();
$('#fb').innerHTML=`<div class=fb style="background:var(--${ok?'ok':'bad'});color:#fff">${ok?'⚔️ Slash! ':'💥 Ouch! '}${msg}</div><button class=btn data-a=next style="margin-top:8px">${g.lives?'Next ▶':'Continue'}</button>`}
function hint(){if(g.lock||g.hints<1)return;
if(g.k<4){if(g.tr)return;g.tr=1;let n=0;document.querySelectorAll('.opt').forEach((x,j)=>{if(!g.o[j][1]&&n<2){n++;x.disabled=1;x.classList.add('off')}});$('#fb').innerHTML=`<div class=fb style="background:var(--line)">💡 ${g.qs[g.i][3]}</div>`}
else{const t=g.ans[0].split(' ');if(g.b.some((k,j)=>g.tl[k]!=t[j]))g.b=[];if(g.b.length>=t.length)return;const w=t[g.b.length];g.b.push(g.tl.findIndex((x,k)=>x==w&&!g.b.includes(k)));sU()}
g.hints--;hud()}
function win(){const s=g.lives;g.score+=s*50;st[g.k]=Math.max(st[g.k],s);sv();const last=g.k==4;
main.innerHTML=`<div class=card style=text-align:center><h1>${last?'🏆 Modal Master!':'🎉 Level cleared!'}</h1><p style=font-size:28px>${'★'.repeat(s)+'☆'.repeat(3-s)}</p><p>Score: <b>${g.score}</b></p><p>${last?'You conquered all five levels, ninja! Total stars: '+st.reduce((a,b)=>a+b)+' / 15':'The next gate opens…'}</p>${last?'':`<button class=btn data-a=go data-k=${g.k+1}>Next level ▶</button> `}<button data-a=go data-k=${g.k}>Replay</button> <button data-a=home>Map</button></div>`}
function over(){main.innerHTML=`<div class=card style=text-align:center><h1>💀 Defeated</h1><p>Score: ${g.score}. A true ninja trains again!</p><button class=btn data-a=go data-k=${g.k}>Retry level</button> <button data-a=home>Map</button></div>`}
document.onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,k=+b.dataset.k;
switch(a){case'go':go(k);break;case'home':home();break;case'hint':hint();break;
case'pick':{if(g.lock)break;g.lock=1;const o=g.o[k];document.querySelectorAll('.opt').forEach((x,j)=>{if(g.o[j][1])x.classList.add('ok');else if(x==b)x.classList.add('no')});res(o[1],g.qs[g.i][4]);break}
case'next':g.lives?(g.i++,nx()):over();break;
case'add':if(!g.lock){g.b.push(k);sU()}break;
case'un':if(!g.lock){g.b=g.b.filter(x=>x!=k);sU()}break;
case'clr':if(!g.lock){g.b=[];sU()}break;
case'chk':{if(g.lock)break;if(g.b.length<g.tl.length){$('#fb').innerHTML='<div class=fb style="background:var(--line)">Use all the words first!</div>';break}
const s=g.b.map(j=>g.tl[j]).join(' ').toLowerCase(),ok=g.ans.some(x=>x.toLowerCase()==s);res(ok,ok?'Perfect sentence!':'Correct: '+g.ans[0]);break}}};
home();
</script></body></html>
